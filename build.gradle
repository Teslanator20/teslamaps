plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    // DevAuth, so runClient can log into a real account (~/.devauth)
    maven {
        url = 'https://pkgs.dev.azure.com/djtheredstoner/DevAuth/_packaging/public/maven/v1'
        content { includeGroupAndSubgroups('me.djtheredstoner') }
    }
}

loom {
    accessWidenerPath = file("src/main/resources/teslamaps.accesswidener")

    runs {
        client {
            programArgs "--quickPlaySingleplayer", "New World"
            // ./gradlew.bat runClient -Pjfr=120  -> run/teslamaps.jfr
            // JFR sees every thread and records allocation, GC and safepoints,
            // which the render-thread sampler in spark cannot.
            // ./gradlew.bat runClient -Pda=alt  -> log in as that devauth account
            if (project.hasProperty("da")) {
                property "devauth.account", project.da
            }
            // ./gradlew.bat runClient -Pnoauth  -> skip the devauth login, offline dev account
            if (project.hasProperty("noauth")) {
                property "devauth.enabled", "false"
            }
            // ./gradlew.bat runClient -Ptooltiptest  -> opens the enchant tooltip test screen
            if (project.hasProperty("tooltiptest")) {
                property "teslamaps.tooltiptest", "true"
            }
            if (project.hasProperty("jfr")) {
                vmArgs "-XX:StartFlightRecording=duration=${project.jfr}s,settings=profile," +
                        "filename=${rootDir}/run/teslamaps.jfr,dumponexit=true"
            }
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    // 26.1+ is unobfuscated: the net.fabricmc.fabric-loom variant does not remap,
    // so no mappings line and plain implementation/compileOnly instead of modImplementation.
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Include Gson for JSON parsing (bundled with Minecraft but explicit)
    implementation 'com.google.code.gson:gson:2.10.1'

    // dev only: real account login for runClient, picks the account from ~/.devauth/config.toml
    runtimeOnly "me.djtheredstoner:DevAuth-fabric:${devauth_version}"
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": project.minecraft_version,
                "loader_version": project.loader_version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}


// compile-time copy of Mod Menu's two api interfaces, not shipped: the real ones come from Mod Menu at runtime
sourceSets {
    modmenuStubs {
        compileClasspath += configurations.compileClasspath
    }
    main {
        compileClasspath += modmenuStubs.output
    }
}
